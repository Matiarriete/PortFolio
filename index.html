    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)" />

    <!-- Applies the persisted theme before first paint so there is no flash of the wrong theme. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
